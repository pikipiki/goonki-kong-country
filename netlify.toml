[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Netlify injects the "Powered by Netlify" HUD on Free public sites; block its script.
[[redirects]]
  from = "/.netlify/scripts/*"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
